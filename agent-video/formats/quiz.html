<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../lib/common.css">
<style>
  #stage{background:#E8F0FE}
  #q{position:absolute;left:60px;right:60px;top:220px;text-align:center;font-weight:700;font-size:78px;line-height:1.15}
  #card{position:absolute;left:60px;right:60px;top:600px;background:#fff;border:7px solid #111;border-radius:34px;padding:50px 50px;font-size:62px;line-height:1.6;font-weight:600;box-shadow:0 24px 0 #111}
  .e{position:relative;display:inline-block}
  .ring{position:absolute;left:-14px;right:-14px;top:-4px;bottom:-4px;border:7px solid #E23B3B;border-radius:50%;opacity:0}
  #clock{position:absolute;left:50%;top:1380px;width:200px;height:200px;margin-left:-100px}
  #clock text{font:700 92px Poppins;fill:#111}
  #ans{position:absolute;left:60px;right:60px;top:1400px;text-align:center;font-weight:700;font-size:62px;line-height:1.25;opacity:0}
  #cta{position:absolute;left:60px;right:60px;top:1400px;text-align:center;font-weight:700;font-size:56px;line-height:1.3;opacity:0;background:#FFD166;border:6px solid #111;border-radius:30px;padding:26px}
</style></head>
<body>
<div id="stage">
  <div class="hdr"><img src="../lib/logo.png"><span>Lexy<span class="lab">Lab</span></span></div>
  <div id="q"></div>
  <div id="card"></div>
  <svg id="clock" viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="#fff" stroke="#E5E5E5" stroke-width="18"/>
    <circle id="arc" cx="100" cy="100" r="86" fill="none" stroke="#1DB584" stroke-width="18" stroke-linecap="round" transform="rotate(-90 100 100)" stroke-dasharray="540" stroke-dashoffset="0"/>
    <text id="num" x="100" y="132" text-anchor="middle">5</text></svg>
  <div id="ans"></div>
  <div id="cta"></div>
  <div id="endwrap"></div>
</div>
<script src="../lib/common.js"></script>
<script>
/* params :
  question  ex. "Trouve les *4 fautes* en 5 secondes 👀"
  sentence  phrase avec [faute|correction]
  seconds   durée du compte à rebours (défaut 5)
  answer    ex. "LexyLab les a *toutes* trouvées ✨"
  cta       ex. "T'en as trouvé combien ? Dis-le en commentaire 👇"
  end_tag, music
*/
let P,segs,T={};
function init(p){
  P=p; segs=U.parseErr(p.sentence); const n=segs.filter(s=>s.e).length; const sec=p.seconds||5;
  document.getElementById('q').innerHTML=U.md(p.question||'Trouve les fautes 👀');
  let h='',i=0; for(const s of segs){ if(s.t!==undefined) h+=U.esc(s.t); else { h+=`<span class="e" id="e${i}"><span id="w${i}">${U.esc(s.e)}</span><span class="ring" id="r${i}"></span></span>`; i++; } }
  document.getElementById('card').innerHTML=h;
  document.getElementById('ans').innerHTML=U.md(p.answer||'LexyLab les a *toutes* trouvées ✨');
  document.getElementById('cta').innerHTML=U.md(p.cta||'T\'en as trouvé combien ? Dis-le en commentaire 👇');
  document.getElementById('endwrap').innerHTML=U.endHTML(p.end_tag);
  T.card=1.4; T.c=[2.2,2.2+sec]; T.rings=[]; for(let k=0;k<n;k++) T.rings.push(T.c[1]+0.5+k*0.55);
  T.fix=T.rings[n-1]+0.8; T.fixes=[]; for(let k=0;k<n;k++) T.fixes.push(T.fix+k*0.4);
  T.ans=T.fixes[n-1]+0.3; T.cta=T.ans+2.4; T.end=T.cta+3.0;
  const ev=[{t:0.2,type:'boom'},{t:T.card,type:'pop'}];
  for(let k=0;k<sec;k++) ev.push({t:T.c[0]+k,type:'tick'});
  ev.push({t:T.c[1],type:'buzz'}); T.rings.forEach(r=>ev.push({t:r,type:'pop'})); T.fixes.forEach(f=>ev.push({t:f,type:'ding'}));
  ev.push({t:T.cta,type:'pop'},{t:T.end,type:'chime'});
  const av=U.autoVoices(p,[[0.3,'q'],[T.ans,'a'],[T.cta,'c']]); ev.push(...U.voiceEvents(p),...av);
  return {duration:Math.max(T.end+3.4, U.voiceEnd(p)+1, (av.end||0)+3.4), events:ev, typing:[], music:p.music||'tension'};
}
function render(t){
  document.getElementById('stage').style.opacity=U.clamp(t/0.3,0,1);
  document.getElementById('q').style.transform=`scale(${U.pop((t-0.1)/0.35)})`;
  const c=document.getElementById('card'); c.style.opacity=t>=T.card?1:0; c.style.transform=`scale(${U.pop((t-T.card)/0.3)})`;
  const clk=document.getElementById('clock'); const sec=T.c[1]-T.c[0];
  clk.style.opacity=(t>=T.c[0]-0.2&&t<T.c[1]+0.4)?1:0;
  const k=U.clamp((t-T.c[0])/sec,0,1); document.getElementById('arc').setAttribute('stroke-dashoffset',540*k);
  document.getElementById('arc').setAttribute('stroke', k>0.66?'#E23B3B':'#1DB584');
  document.getElementById('num').textContent=Math.max(1,Math.min(sec,Math.ceil(sec-(t-T.c[0]))));
  clk.style.transform=`scale(${1+0.06*Math.max(0,Math.sin((t-T.c[0])*Math.PI*2))})`;
  T.rings.forEach((r,i)=>{ const ring=document.getElementById('r'+i), w=document.getElementById('w'+i);
    ring.style.opacity=(t>=r&&t<T.fixes[i])?1:0; ring.style.transform=`scale(${U.pop((t-r)/0.3)})`;
    const seg=segs.filter(s=>s.e)[i];
    if(t>=T.fixes[i]){ w.textContent=seg.f; w.className='fix'; } else { w.textContent=seg.e; w.className=t>=r?'err':''; } });
  const a=document.getElementById('ans'); a.style.opacity=(t>=T.ans&&t<T.cta)?1:0; a.style.transform=`scale(${U.pop((t-T.ans)/0.3)})`;
  const ct=document.getElementById('cta'); ct.style.opacity=t>=T.cta?1:0; ct.style.transform=`scale(${U.pop((t-T.cta)/0.3)}) rotate(${Math.sin(t*4)*1.2}deg)`;
  U.renderEnd(t,T.end);
}
window.init=init; window.render=render;
</script>
</body></html>
